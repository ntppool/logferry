before:
  # we don't want this in the CI environment
  #hooks:
  #  - go mod tidy
  #  - go generate ./...
builds:
  - main: ./
    id: logferry
    binary: logferry
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - freebsd
      - darwin
    ldflags:
      - -s -w
      - -X go.ntppool.org/common/version.VERSION={{.Version}}
      - -X go.ntppool.org/common/version.gitVersion={{.ShortCommit}}
      - -X go.ntppool.org/common/version.buildTime={{.Date}}

  - main: ./logferry-api/
    id: logferry-api
    binary: logferry-api
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - freebsd
      - darwin
    ldflags:
      - -s -w
      - -X go.ntppool.org/common/version.VERSION={{.Version}}
      - -X go.ntppool.org/common/version.gitVersion={{.ShortCommit}}
      - -X go.ntppool.org/common/version.buildTime={{.Date}}

archives:
  - id: a1
    allow_different_binary_count: true
  # files:
  #   - LICENSE.txt
  #   - ./client/cmd/ntppool-monitor/README.md

checksum:
  name_template: "checksums.txt"
snapshot:
  name_template: '{{ .Tag }}{{ if index .Env "DRONE_BUILD_NUMBER" }}-{{ .Env.DRONE_BUILD_NUMBER }}{{ else }}-next{{ end }}'
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - id: logferry

    # Name of the package.
    # Defaults to `ProjectName`.
    package_name: logferry

    #file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    file_name_template: "{{ .ConventionalFileName }}"

    vendor: NTP Pool Project
    homepage: https://www.ntppool.org/
    maintainer: Ask Bjørn Hansen <ask@develooper.com>
    description: Log shipping daemon for GeoDNS
    license: Apache 2.0
    formats:
      - deb
      - rpm
      - apk
    # dependencies:
    #   - chrony
    bindir: /usr/bin

    # overrides:
    #   deb:
    #     dependencies:
    #       - "ntp | chrony"

    contents:
      - src: "scripts/logferry.service"
        dst: "/etc/systemd/system/logferry.service"

      - src: "scripts/defaults"
        dst: "/etc/default/logferry.sample"
        type: config

      - src: "scripts/defaults"
        dst: "/etc/default/logferry"
        type: config|noreplace

    scripts:
      preinstall: scripts/preinstall.sh
      postinstall: scripts/postinstall.sh
