when:
  - event: [push, tag, pull_request]

variables:
  - &go_env
    GOMODCACHE: /go/pkg/mod
    GOCACHE: /go/pkg/cache
  - &go_volumes
    - go-pkg:/go/pkg

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true

steps:
  - name: test
    image: golang:1.26
    pull: true
    environment: *go_env
    volumes: *go_volumes
    commands:
      - go test -v ./...
      - go build ./...
    backend_options:
      kubernetes:
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 128Mi

  - name: goreleaser
    image: golang:1.26
    pull: true
    depends_on: [test]
    environment: *go_env
    volumes: *go_volumes
    commands:
      - ./scripts/run-goreleaser
    backend_options:
      kubernetes:
        resources:
          limits:
            cpu: 10000m
            memory: 4096Mi
          requests:
            cpu: 6000m
            memory: 1024Mi

  - name: generate-tags
    image: ghcr.io/abh/woodpecker-docker-tags-plugin:sha-8a3bd7c
    depends_on: [test]
    settings:
      tags: |
        branch
        sha
        raw -v build-${CI_PIPELINE_NUMBER}
        semver --auto

  - name: docker
    image: woodpeckerci/plugin-kaniko
    pull: true
    depends_on: [goreleaser, generate-tags]
    settings:
      registry: harbor.ntppool.org
      repo: ntppool/logferry
      tags_file: .tags
      cache: true
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password

  - name: upload
    image: woodpeckerci/plugin-s3
    depends_on: [goreleaser]
    when:
      - event: push
        branch: main
      - event: tag
    settings:
      access_key:
        from_secret: s3_access_key
      secret_key:
        from_secret: s3_secret_key
      bucket: ntp-releases
      target: /logferry/builds/test/${CI_PIPELINE_NUMBER}
      source: dist/*
      strip_prefix: dist/
      endpoint: https://c3.hkga.ntp.dev/
      path_style: true
    backend_options:
      kubernetes:
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 64Mi

  - name: fury-publish
    image: golang:1.26
    depends_on: [goreleaser]
    when:
      - event: push
        branch: main
      - event: tag
    environment:
      <<: *go_env
      FURY_TOKEN:
        from_secret: fury_test_token
    volumes: *go_volumes
    commands:
      - ./scripts/fury-publish ntppool-test
    backend_options:
      kubernetes:
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 64Mi
